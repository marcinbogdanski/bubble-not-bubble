<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bubble or Not Bubble{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
      --side-bg: #f6f8fa; --active: #e7ecf2; --link: #0969da;
      --user-bg: #eef4ff; --code-bg: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
        --side-bg: #161b22; --active: #21262d; --link: #4493f8;
        --user-bg: #15233a; --code-bg: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 15px/1.55 system-ui, -apple-system, sans-serif; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .layout { display: flex; min-height: 100vh; }
    nav { width: 260px; flex-shrink: 0; background: var(--side-bg);
          border-right: 1px solid var(--border); padding: 1rem 0.75rem;
          position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    nav .brand { font-weight: 600; padding: 0 0.5rem 1rem; }
    nav h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
             color: var(--muted); margin: 1rem 0.5rem 0.25rem; }
    nav a { display: block; padding: 0.3rem 0.5rem; border-radius: 6px; color: var(--fg);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    nav a.active { background: var(--active); font-weight: 600; }
    nav a:hover { background: var(--active); text-decoration: none; }
    main { flex: 1; min-width: 0; padding: 1.5rem 2rem; max-width: 56rem; }
    .muted { color: var(--muted); }
    pre, code { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { background: var(--code-bg); padding: 0.75rem; border-radius: 6px; overflow-x: auto; }
    code { background: var(--code-bg); padding: 0.1em 0.3em; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 0.3rem 0.6rem; text-align: left; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      nav { width: auto; height: auto; position: static; border-right: 0;
            border-bottom: 1px solid var(--border); }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="brand">Bubble or Not Bubble</div>
    <h2>Report</h2>
    <a href="/" class="{{ 'active' if path == '/' }}">Main Report</a>
    <h2><a href="/claude" style="padding:0;color:inherit">Claude</a></h2>
    {% for s in sessions %}
      <a href="/claude/{{ s.id }}" title="{{ s.title }}"
         class="{{ 'active' if path == '/claude/' ~ s.id }}">{{ s.title }}</a>
    {% else %}
      <span class="muted" style="padding:0 0.5rem">No chats yet</span>
    {% endfor %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
